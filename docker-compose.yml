# Streaming stack (Ashish). Backend/dashboard/monitoring land on their feature branches.
services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
      - --rpc-addr
      - redpanda:33145
      - --advertise-rpc-addr
      - redpanda:33145
      - --mode
      - dev-container
      - --smp
      - "1"
      - --default-log-level
      - warn
      - --overprovisioned
    ports:
      - "127.0.0.1:19092:19092"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 5s
      timeout: 5s
      retries: 20

  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        rpk topic create events.raw events.processed --brokers redpanda:9092 -p 3 -r 1 --config retention.ms=86400000 || true
        rpk topic create anomalies.detected alerts.generated events.dlq --brokers redpanda:9092 -p 3 -r 1 --config retention.ms=259200000 || true

  train:
    build:
      context: .
      dockerfile: streaming/Dockerfile
    command: python -m ml.train_all
    volumes:
      - ml_artifacts:/app/ml/artifacts
    restart: "no"

  streaming:
    build:
      context: .
      dockerfile: streaming/Dockerfile
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      ML_ARTIFACT_DIR: /app/ml/artifacts
      ORG_CONFIG_DIR: /app/data/orgs
      STREAMING_METRICS_PORT: "8001"
      STREAMING_HEALTH_PORT: "8002"
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
      train:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8001:8001"
      - "127.0.0.1:8002:8002"
    volumes:
      - ml_artifacts:/app/ml/artifacts
    restart: unless-stopped

  generator:
    build:
      context: .
      dockerfile: data/Dockerfile
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    depends_on:
      streaming:
        condition: service_started
    command: python -m data.generators.generate --scenario normal --rate 4 --organization_id ORG_HOSPITAL_001
    restart: unless-stopped

volumes:
  ml_artifacts:
