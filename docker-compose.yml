# Streaming stack (Ashish). Backend/dashboard/monitoring land on their feature branches.
services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
      - --rpc-addr
      - redpanda:33145
      - --advertise-rpc-addr
      - redpanda:33145
      - --mode
      - dev-container
      - --smp
      - "1"
      - --default-log-level
      - warn
      - --overprovisioned
    ports:
      - "127.0.0.1:19092:19092"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 5s
      timeout: 5s
      retries: 20

  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        create_topics() {
          rpk topic create events.raw events.processed --brokers redpanda:9092 -p 3 -r 1 --config retention.ms=86400000 || true
          rpk topic create anomalies.detected alerts.generated events.dlq --brokers redpanda:9092 -p 3 -r 1 --config retention.ms=259200000 || true
        }
        i=0
        while [ "$$i" -lt 15 ]; do
          create_topics
          ok=1
          for t in events.raw events.processed anomalies.detected alerts.generated events.dlq; do
            if ! rpk topic describe "$$t" --brokers redpanda:9092 >/dev/null 2>&1; then
              ok=0
            fi
          done
          if [ "$$ok" -eq 1 ]; then
            rpk topic list --brokers redpanda:9092
            exit 0
          fi
          i=$$((i+1))
          sleep 2
        done
        echo "topic create failed"
        exit 1

  train:
    build:
      context: .
      dockerfile: streaming/Dockerfile
    command: python -m ml.train_all
    volumes:
      - ml_artifacts:/app/ml/artifacts
    restart: "no"

  streaming:
    build:
      context: .
      dockerfile: streaming/Dockerfile
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      ML_ARTIFACT_DIR: /app/ml/artifacts
      ORG_CONFIG_DIR: /app/data/orgs
      STREAMING_METRICS_PORT: "8001"
      STREAMING_HEALTH_PORT: "8002"
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
      train:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8001:8001"
      - "127.0.0.1:8002:8002"
    volumes:
      - ml_artifacts:/app/ml/artifacts
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,urllib.request; b=json.load(urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=2)); raise SystemExit(0 if b.get('status')=='ok' else 1)",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  generator:
    build:
      context: .
      dockerfile: data/Dockerfile
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    depends_on:
      streaming:
        condition: service_healthy
    command: python -m data.generators.generate --scenario normal --rate 4 --organization_id ORG_HOSPITAL_001
    restart: unless-stopped

volumes:
  ml_artifacts:
