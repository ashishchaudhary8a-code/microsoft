# Full local stack. Ports bound to localhost (contract §24).
services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
      - --rpc-addr
      - redpanda:33145
      - --advertise-rpc-addr
      - redpanda:33145
      - --mode
      - dev-container
      - --smp
      - "1"
      - --default-log-level
      - warn
      - --overprovisioned
    ports:
      - "127.0.0.1:19092:19092"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 5s
      timeout: 5s
      retries: 20

  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        create_topics() {
          rpk topic create events.raw events.processed --brokers redpanda:9092 -p 3 -r 1 --config retention.ms=86400000 || true
          rpk topic create anomalies.detected alerts.generated events.dlq --brokers redpanda:9092 -p 3 -r 1 --config retention.ms=259200000 || true
        }
        i=0
        while [ "$$i" -lt 15 ]; do
          create_topics
          ok=1
          for t in events.raw events.processed anomalies.detected alerts.generated events.dlq; do
            if ! rpk topic describe "$$t" --brokers redpanda:9092 >/dev/null 2>&1; then
              ok=0
            fi
          done
          if [ "$$ok" -eq 1 ]; then
            rpk topic list --brokers redpanda:9092
            exit 0
          fi
          i=$$((i+1))
          sleep 2
        done
        echo "topic create failed"
        exit 1

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-anomaly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-anomaly_demo}
      POSTGRES_DB: ${POSTGRES_DB:-anomaly}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-anomaly} -d ${POSTGRES_DB:-anomaly}"]
      interval: 5s
      timeout: 3s
      retries: 20

  train:
    build:
      context: .
      dockerfile: streaming/Dockerfile
    command: python -m ml.train_all
    volumes:
      - ml_artifacts:/app/ml/artifacts
    restart: "no"

  streaming:
    build:
      context: .
      dockerfile: streaming/Dockerfile
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      ML_ARTIFACT_DIR: /app/ml/artifacts
      ORG_CONFIG_DIR: /app/data/orgs
      STREAMING_METRICS_PORT: "8001"
      STREAMING_HEALTH_PORT: "8002"
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
      train:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8001:8001"
      - "127.0.0.1:8002:8002"
    volumes:
      - ml_artifacts:/app/ml/artifacts
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,urllib.request; b=json.load(urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=2)); raise SystemExit(0 if b.get('status')=='ok' else 1)",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-anomaly}:${POSTGRES_PASSWORD:-anomaly_demo}@postgres:5432/${POSTGRES_DB:-anomaly}
      POSTGRES_USER: ${POSTGRES_USER:-anomaly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-anomaly_demo}
      POSTGRES_DB: ${POSTGRES_DB:-anomaly}
      POSTGRES_HOST: postgres
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      ORG_CONFIG_DIR: /app/data/orgs
      STREAMING_HEALTH_URL: http://streaming:8002/health
      BACKEND_CONSUME: "1"
      SEED_ORGS: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
      streaming:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)",
        ]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 15s

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:80"
    restart: unless-stopped

  generator:
    build:
      context: .
      dockerfile: data/Dockerfile
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    depends_on:
      streaming:
        condition: service_healthy
    command: python -m data.generators.generate --scenario normal --rate 4 --organization_id ORG_HOSPITAL_001
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - streaming
      - backend
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.2
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  ml_artifacts:
  pg_data:
